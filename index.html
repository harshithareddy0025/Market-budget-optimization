<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MarketMind – Budget Optimization Agent</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--tx:#161a2b;--mu:#6b7287;--bd:#e3e6ef;--ac:#4f46e5;--ok:#0f9d6b;--bad:#d9453d;--wn:#c77d00;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--card:#181c30;--tx:#eceefa;--mu:#9aa1bd;--bd:#2a2f4a;--ac:#8b85ff;--ok:#34d399;--bad:#f87171;--wn:#fbbf24}}
:root[data-theme=dark]{--bg:#0f1220;--card:#181c30;--tx:#eceefa;--mu:#9aa1bd;--bd:#2a2f4a;--ac:#8b85ff;--ok:#34d399;--bad:#f87171;--wn:#fbbf24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--mu);font-size:13px}select,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}nav button.on{color:var(--ac);border-color:var(--ac)}
main{padding:16px 20px;max-width:1200px;margin:auto}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}.c h3{margin:0 0 8px;font-size:14px}
.kl{color:var(--mu);font-size:12px}.kv{font-size:24px;font-weight:700}.ks{font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}.mu{color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child,th.l,td.l{text-align:left}th{color:var(--mu);font-weight:600;cursor:pointer}
.b{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.Scale{background:#0f9d6b26;color:var(--ok)}.Cut{background:#d9453d26;color:var(--bad)}.Fix{background:#c77d0026;color:var(--wn)}.Maintain{background:#6b728726;color:var(--mu)}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.sl label{display:block;font-size:12px;color:var(--mu)}.sl b{color:var(--tx)}input[type=range]{width:100%;accent-color:var(--ac)}
#chat{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.m{max-width:88%;padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--bd)}.m.u{align-self:flex-end;background:var(--ac);color:#fff;border:0}
.chip{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:5px 11px;margin:3px 4px 0 0;cursor:pointer;font:inherit;font-size:12px}.chip:hover{border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1}.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 16px;font:inherit;font-weight:600;cursor:pointer}
svg text{fill:var(--mu);font-size:11px}ul{margin:4px 0;padding-left:18px}
</style></head><body>
<header><h1>MarketMind<small>AI budget optimization agent · 16 campaigns · 8 channels · assumed 12-month data</small></h1>
<div class="ctl"><label>LTV horizon <select id="hor"><option value="6">6 mo</option><option value="12" selected>12 mo</option><option value="24">24 mo</option></select></label>
<label><input type="checkbox" id="inc" checked> Adjust for incrementality</label></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const F=n=>(n<0?"−":"")+"$"+(Math.abs(n)>=1e6?(Math.abs(n)/1e6).toFixed(2)+"M":Math.abs(n)>=1e3?(Math.abs(n)/1e3).toFixed(0)+"k":Math.abs(n).toFixed(0));
const P=n=>(n*100).toFixed(0)+"%";
// channel: cpc, conv rate, AOV, margin, LTV multiplier, refund rate, response-curve exponent
const CH={"Google Search":[2.4,.05,95,.55,1.9,.05,.62],"Meta Ads":[1.1,.028,80,.55,1.7,.09,.55],"YouTube":[.6,.011,85,.55,1.5,.07,.7],"LinkedIn":[6.5,.03,320,.6,2.2,.04,.5],"Email":[.5,.025,70,.7,2.6,.02,.35],"Influencer":[1.8,.02,110,.5,1.4,.18,.65],"Affiliate":[.9,.03,75,.5,1.3,.22,.6],"Display":[.4,.0055,70,.5,1.2,.1,.8]};
// campaign: channel, name, spend, conv multiplier, incrementality (share of conversions that would not have happened anyway)
const CP=[["Google Search","Brand Search",120e3,1.6,.3],["Google Search","Generic Non-Brand",60e3,1,.85],["Meta Ads","Retargeting",140e3,1.3,.4],["Meta Ads","Prospecting Lookalike",90e3,.9,.85],["YouTube","Brand Awareness",70e3,.6,.5],["YouTube","Product Demo",50e3,1.3,.7],["LinkedIn","ABM Enterprise",45e3,1.3,.8],["LinkedIn","Lead Gen Forms",30e3,.8,.8],["Email","Win-back",12e3,1.2,.85],["Email","Welcome Series",8e3,1.4,.8],["Influencer","Macro Creators",80e3,.8,.6],["Influencer","Micro Creators",50e3,1.4,.8],["Affiliate","Coupon Sites",40e3,1.3,.4],["Affiliate","Content Partners",35e3,1.1,.75],["Display","Programmatic Banner",60e3,.9,.5],["Display","Retargeting Display",50e3,1.5,.45]];
const S={tab:"Overview",bp:100,sh:40,sort:"c0",dir:1};
const HF={6:.7,12:1,24:1.35};
function calc(){const hf=HF[$("#hor").value],ui=$("#inc").checked;
const R=CP.map(([ch,n,s,cm,inc])=>{const[cpc,cr,aov,m,lm,rf,b]=CH[ch];const A=s/cpc*cr*cm,I=A*(ui?inc:1),GP=aov*m*lm*hf*(1-rf);
return{ch,n,s,A,I,GP,aov,b,c0:I*GP-s,roi:(I*GP-s)/s,cac:s/I,lc:GP/(s/I),roas:I*aov/s,marg:b*I*GP/s-1}});
R.forEach(r=>r.act=r.c0>=0?(r.marg>.3?"Scale":"Maintain"):(r.marg<0?"Cut":"Fix"));
const tot0=R.reduce((a,r)=>a+r.s,0),T=tot0*S.bp/100;let lo=R.map(r=>r.s*(1-S.sh/100));const sl=lo.reduce((a,x)=>a+x,0);if(sl>T)lo=lo.map(x=>x*T/sl);
const al=lo.slice(),hi=R.map(r=>r.s*(1+S.sh/100));let rem=T-al.reduce((a,x)=>a+x,0);const mg=(r,x)=>r.GP*r.I*r.b*Math.pow(x/r.s,r.b-1)/r.s-1;
while(rem>=1000){let bi=-1,bm=0;R.forEach((r,i)=>{if(al[i]+1000<=hi[i]){const v=mg(r,al[i]);if(v>bm){bm=v;bi=i}}});if(bi<0)break;al[bi]+=1000;rem-=1000}
R.forEach((r,i)=>{r.s1=al[i];r.I1=r.I*Math.pow(al[i]/r.s,r.b);r.c1=r.I1*r.GP-al[i];r.d=al[i]-r.s});
const sum=k=>R.reduce((a,r)=>a+r[k],0);return{R,tot0,T,spent:sum("s1"),held:T-sum("s1"),c0:sum("c0"),c1:sum("c1"),I0:sum("I"),I1:sum("I1"),waste:R.filter(r=>r.act=="Cut").reduce((a,r)=>a+r.s,0),loss:R.filter(r=>r.c0<0).reduce((a,r)=>a+r.c0,0)}}
function chans(D){const o={};D.R.forEach(r=>{const c=o[r.ch]||(o[r.ch]={ch:r.ch,s:0,s1:0,c0:0,c1:0,I:0});c.s+=r.s;c.s1+=r.s1;c.c0+=r.c0;c.c1+=r.c1;c.I+=r.I});return Object.values(o)}
const cl=v=>v>=0?"ok":"bad";
function hbar(rows,w=520){const h=rows.length*26+8,mx=Math.max(...rows.map(r=>Math.max(...r.v.map(Math.abs))))||1,z=w/2+40,sc=(w/2-60)/mx;
return`<svg viewBox="0 0 ${w+40} ${h}" width="100%">${rows.map((r,i)=>`<text x="0" y="${i*26+18}">${r.l}</text>`+r.v.map((v,j)=>{const x=v<0?z+v*sc:z;return`<rect x="${x}" y="${i*26+4+j*10}" width="${Math.max(1,Math.abs(v)*sc)}" height="${r.v.length>1?9:16}" rx="2" fill="${r.col[j]}"/>`}).join("")+`<text x="${z+(r.v[0]<0?r.v[0]*sc-4:Math.abs(r.v[0])*sc+4)}" y="${i*26+16}" text-anchor="${r.v[0]<0?"end":"start"}">${r.t}</text>`).join("")}<line x1="${z}" x2="${z}" y1="0" y2="${h}" stroke="var(--bd)"/></svg>`}
function scat(R){const W=560,H=290,mx=Math.max(...R.map(r=>r.s))*1.1,rs=R.map(r=>r.roi),mn=Math.min(-.2,...rs)*1.1,xm=Math.max(.5,...rs)*1.1,X=v=>50+v/mx*(W-70),Y=v=>H-30-(v-mn)/(xm-mn)*(H-50);
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="50" x2="${W-20}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mu)" stroke-dasharray="4"/><text x="52" y="${Y(0)-4}">break-even</text><text x="${W/2}" y="${H-6}" text-anchor="middle">Current spend →</text><text x="4" y="14">ROI ↑</text>${R.map(r=>`<circle cx="${X(r.s)}" cy="${Y(r.roi)}" r="${Math.max(5,Math.sqrt(r.I)/4)}" fill="${r.roi<0?"var(--bad)":"var(--ok)"}" opacity=".6"><title>${r.n}: spend ${F(r.s)}, ROI ${P(r.roi)}</title></circle><text x="${X(r.s)+8}" y="${Y(r.roi)-6}" style="font-size:9px">${r.n.split(" ")[0]}</text>`).join("")}</svg>`}
function tabs(){$("#nav").innerHTML=["Overview","Campaigns","Optimizer","AI Agent"].map(t=>`<button class="${S.tab==t?"on":""}" onclick="S.tab='${t}';draw()">${t}</button>`).join("")}
function kpi(l,v,s,c=""){return`<div class="c"><div class="kl">${l}</div><div class="kv ${c}">${v}</div><div class="ks mu">${s}</div></div>`}
function insights(D){const w=[...D.R].filter(r=>r.act=="Cut").sort((a,b)=>a.c0-b.c0),b=[...D.R].filter(r=>r.act=="Scale").sort((a,b)=>b.marg-a.marg),br=D.R[0];
return`<ul><li><b class="bad">${w.length} campaigns destroy value:</b> ${w.slice(0,3).map(r=>r.n+" ("+F(r.c0)+")").join(", ")}.</li><li><b class="ok">Best headroom:</b> ${b.slice(0,3).map(r=>r.n+" (marginal ROI "+P(r.marg)+")").join(", ")||"none at current settings"}.</li><li><b class="wn">Attribution trap:</b> Brand Search shows ${P(br.A*br.GP/br.s-1)} ROI on last-click but only ${P((br.A*.3*br.GP)/br.s-1)} once incrementality (30%) is applied.</li><li><b>Opportunity:</b> reallocating within ±${S.sh}% limits lifts contribution by <b class="ok">${F(D.c1-D.c0)}</b>.</li></ul>`}
function overview(D){const C=chans(D).sort((a,b)=>b.c0-a.c0);
return`<div class="g k">${kpi("Total spend",F(D.tot0),"8 channels")}${kpi("Incremental customers",Math.round(D.I0).toLocaleString(),"after incrementality")}${kpi("Blended CAC","$"+(D.tot0/D.I0).toFixed(0),"spend ÷ customers")}${kpi("Net contribution",F(D.c0),"LTV profit − spend",cl(D.c0))}${kpi("Spend on ‘Cut’ campaigns",F(D.waste),P(D.waste/D.tot0)+" of budget","bad")}${kpi("Optimized uplift","+"+F(D.c1-D.c0),"range "+F((D.c1-D.c0)*.85)+" – "+F((D.c1-D.c0)*1.15),"ok")}</div>
<div class="g two" style="margin-top:14px"><div class="c"><h3>Net contribution by channel</h3>${hbar(C.map(c=>({l:c.ch,v:[c.c0],t:F(c.c0),col:[c.c0<0?"var(--bad)":"var(--ok)"]})))}</div><div class="c"><h3>Spend vs ROI by campaign (bubble = customers)</h3>${scat(D.R)}</div></div>
<div class="c" style="margin-top:14px"><h3>🤖 Agent’s key findings</h3>${insights(D)}</div>`}
function camps(D){const cols=[["n","Campaign"],["ch","Channel"],["s","Spend"],["A","Attrib. conv"],["I","Incr. cust"],["cac","CAC"],["lc","LTV:CAC"],["roas","ROAS"],["c0","Profit"],["roi","ROI"],["marg","Marginal ROI"],["act","Action"]];
const R=[...D.R].sort((a,b)=>(a[S.sort]>b[S.sort]?1:-1)*S.dir);
return`<div class="c tw"><h3>Campaign scorecard — click a header to sort</h3><table><tr>${cols.map(c=>`<th onclick="S.dir=S.sort=='${c[0]}'?-S.dir:1;S.sort='${c[0]}';draw()">${c[1]}${S.sort==c[0]?(S.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr>${R.map(r=>`<tr><td>${r.n}</td><td class="l mu">${r.ch}</td><td>${F(r.s)}</td><td>${Math.round(r.A).toLocaleString()}</td><td>${Math.round(r.I).toLocaleString()}</td><td>$${r.cac.toFixed(0)}</td><td class="${r.lc>=3?"ok":r.lc<1.5?"bad":"wn"}">${r.lc.toFixed(1)}x</td><td>${r.roas.toFixed(2)}x</td><td class="${cl(r.c0)}">${F(r.c0)}</td><td class="${cl(r.roi)}">${P(r.roi)}</td><td class="${cl(r.marg)}">${P(r.marg)}</td><td><span class="b ${r.act}">${r.act}</span></td></tr>`).join("")}</table><p class="mu">LTV:CAC ≥ 3x is healthy. Marginal ROI = return on the <i>next</i> dollar, from each campaign’s diminishing-returns curve.</p></div>`}
function optimizer(){return`<div class="c"><h3>Scenario controls</h3><div class="sl"><div><label>Total budget: <b id="v1">${S.bp}%</b> of current</label><input type="range" min="70" max="130" value="${S.bp}" oninput="S.bp=+this.value;fill()"></div><div><label>Max shift per campaign: <b id="v2">±${S.sh}%</b></label><input type="range" min="10" max="80" value="${S.sh}" oninput="S.sh=+this.value;fill()"></div></div></div><div id="opt" style="margin-top:14px"></div>`}
function fill(){$("#v1").textContent=S.bp+"%";$("#v2").textContent="±"+S.sh+"%";const D=calc(),C=chans(D),mv=[...D.R].sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
$("#opt").innerHTML=`<div class="g k">${kpi("Budget",F(D.T),"held back: "+F(D.held),"")}${kpi("Contribution now",F(D.c0),"",cl(D.c0))}${kpi("Contribution optimized",F(D.c1),"",cl(D.c1))}${kpi("Uplift","+"+F(D.c1-D.c0),"customers "+(D.I1>=D.I0?"+":"")+Math.round(D.I1-D.I0),"ok")}</div><div class="g two" style="margin-top:14px"><div class="c"><h3>Spend by channel: current vs recommended</h3>${hbar(C.map(c=>({l:c.ch,v:[c.s,c.s1],t:F(c.s1),col:["var(--mu)","var(--ac)"]})))}</div><div class="c tw"><h3>Recommended moves</h3><table><tr><th>Campaign</th><th>Now</th><th>New</th><th>Change</th><th>Profit→</th></tr>${mv.map(r=>`<tr><td>${r.n}</td><td>${F(r.s)}</td><td>${F(r.s1)}</td><td class="${r.d>=0?"ok":"bad"}">${r.d>=0?"+":""}${F(r.d)}</td><td class="${cl(r.c1)}">${F(r.c1)}</td></tr>`).join("")}</table></div></div><p class="mu">Method: greedy marginal-ROI allocation on fitted response curves (customers ∝ spend^b). Unspent budget is held back when the next dollar returns less than $1.</p>`}
let chatInit=false;
function agent(){return`<div class="c"><h3>🤖 Ask the budget agent</h3><div id="chat"></div><div>${["Where are we wasting money?","What should we scale?","Recommend a reallocation","Which campaigns have the worst CAC?","Why is Brand Search misleading?","Expected uplift?"].map(q=>`<button class="chip" onclick="ask('${q}')">${q}</button>`).join("")}</div><div class="row"><input type="text" id="q" placeholder="Try: how is LinkedIn doing?" onkeydown="if(event.key=='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div></div>`}
function say(h,u){const c=$("#chat");c.insertAdjacentHTML("beforeend",`<div class="m ${u?"u":""}">${h}</div>`);c.scrollTop=c.scrollHeight}
function ask(t){const i=$("#q");t=t||i.value.trim();if(!t)return;i.value="";say(t,1);say('<span class="mu">Analyzing campaigns · fitting response curves · running optimizer…</span>');setTimeout(()=>{$("#chat").lastChild.remove();say(reply(t.toLowerCase()))},600)}
function reply(q){const D=calc(),R=D.R,ls=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
if(/waste|ineffic|cut|worst|losing|bad/.test(q)&&!/cac/.test(q)){const w=R.filter(r=>r.act=="Cut").sort((a,b)=>a.c0-b.c0);return`<b>${F(D.waste)}</b> (${P(D.waste/D.tot0)}) sits in campaigns that lose money <i>and</i> get worse at the margin:`+ls(w.map(r=>`<b>${r.n}</b> (${r.ch}): spend ${F(r.s)}, profit <span class="bad">${F(r.c0)}</span>, LTV:CAC ${r.lc.toFixed(1)}x`))}
if(/scale|best|winner|top|grow|invest/.test(q)){const w=R.filter(r=>r.c0>0).sort((a,b)=>b.marg-a.marg).slice(0,5);return"Best places for the next dollar:"+ls(w.map(r=>`<b>${r.n}</b>: ROI ${P(r.roi)}, marginal ${P(r.marg)}, LTV:CAC ${r.lc.toFixed(1)}x. Recommended spend ${F(r.s)} → ${F(r.s1)}`))}
if(/realloc|recommend|optimi|move|shift|budget/.test(q)){const m=[...R].sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,6);return`Within ±${S.sh}% per campaign and a ${F(D.T)} budget:`+ls(m.map(r=>`${r.d>=0?"Increase":"Reduce"} <b>${r.n}</b> by ${F(Math.abs(r.d))}`))+`Net contribution moves <b>${F(D.c0)} → ${F(D.c1)}</b>. Tune it in the Optimizer tab.`}
if(/cac|ltv|payback/.test(q)){const w=[...R].sort((a,b)=>b.cac-a.cac).slice(0,5);return"Highest acquisition cost:"+ls(w.map(r=>`<b>${r.n}</b>: CAC $${r.cac.toFixed(0)} vs 12-mo gross profit/customer $${r.GP.toFixed(0)} (${r.lc.toFixed(1)}x)`))}
if(/brand|increment|attrib|cannibal|last.?click/.test(q)){const r=R[0];return`Brand Search captures people already searching for us. Last-click credits it with ${Math.round(r.A).toLocaleString()} conversions, but a holdout test estimate says only ~30% are incremental. Toggle <i>Adjust for incrementality</i> in the header to see profit swing from <b>${F(r.A*r.GP-r.s)}</b> to <b class="bad">${F(r.A*.3*r.GP-r.s)}</b>. Same logic applies to retargeting and coupon sites.`}
if(/uplift|impact|forecast|expect|gain|result/.test(q))return`Expected contribution uplift: <b class="ok">+${F(D.c1-D.c0)}</b> (planning range ${F((D.c1-D.c0)*.85)}–${F((D.c1-D.c0)*1.15)}, ±15% model error). Incremental customers: ${Math.round(D.I0).toLocaleString()} → ${Math.round(D.I1).toLocaleString()}. Validate with a geo-holdout before moving the full budget.`;
const c=Object.keys(CH).find(k=>q.includes(k.toLowerCase().split(" ")[0]));if(c){const rs=R.filter(r=>r.ch==c);return`<b>${c}</b>`+ls(rs.map(r=>`${r.n}: spend ${F(r.s)}, profit <span class="${cl(r.c0)}">${F(r.c0)}</span>, CAC $${r.cac.toFixed(0)}, action <span class="b ${r.act}">${r.act}</span>`))}
return"I can analyze waste, winners, reallocation, CAC/LTV, incrementality, uplift, or any channel (e.g. “LinkedIn”). Try a chip below."}
function draw(){tabs();const D=calc(),m=$("#main");if(S.tab=="Overview")m.innerHTML=overview(D);else if(S.tab=="Campaigns")m.innerHTML=camps(D);else if(S.tab=="Optimizer"){m.innerHTML=optimizer();fill()}else{m.innerHTML=agent();say("Hi, I’m MarketMind. I’ve analyzed 16 campaigns across 8 channels. Ask me where money is being wasted or how to reallocate.")}}
$("#hor").onchange=$("#inc").onchange=()=>draw();draw();
</script></body></html>
